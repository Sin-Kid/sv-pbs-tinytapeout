# Tiny Tapeout project information
project:
  title:        "Design and Implementation of a MOSFET-Based Adaptive Battery Safety Monitoring and Protection ASIC Using CMOS Technology"      # Project title
  author:       "Pavan G"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Battery safety ASIC: filters V/I/T samples, validates sensors, predicts thermal risk and drives an external protection MOSFET"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_rvce_sv_pbs"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "sv_pbs_core.v"
    - "moving_average3.v"
    - "sensor_validator.v"
    - "thermal_predictor.v"
    - "baseline_controller.v"
    - "proposed_controller.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA0"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7"

  # Outputs
  uo[0]: "STATE0"
  uo[1]: "STATE1"
  uo[2]: "DERATE"
  uo[3]: "ISOLATE (MOSFET gate request)"
  uo[4]: "SENSOR_DEGRADED"
  uo[5]: "THERMAL_RISK"
  uo[6]: "BASE_ISOLATE"
  uo[7]: "BASE_DERATE"

  # Bidirectional pins
  uio[0]: "BYTE_STROBE (in)"
  uio[1]: "SAMPLE_COMMIT (in)"
  uio[2]: "FAULT0"
  uio[3]: "FAULT1"
  uio[4]: "FAULT2"
  uio[5]: "BASE_STATE0"
  uio[6]: "BASE_STATE1"
  uio[7]: "BUSY"

# Do not change!
yaml_version: 6
